[project]
name = "syllabus-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "trihieuvincentt", email = "trihieu20102005gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
syllabus-qa = "syllabus_qa:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
