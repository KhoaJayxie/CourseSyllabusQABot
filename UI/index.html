<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#212121" />
  <title>Sử Ký AI</title>

  <!-- Tailwind qua CDN: chỉ dùng khi phát triển. Khi triển khai, hãy build bằng Tailwind CLI. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
          colors: {
            chat: {
              main:  '#212121',  // nền khung chat
              side:  '#171717',  // nền sidebar
              input: '#2f2f2f',  // ô nhập, bong bóng người dùng
              hover: '#2a2a2a',  // hover / mục đang chọn
              line:  '#3a3a3a',  // đường viền
              text:  '#ececec',  // chữ chính
              mute:  '#9b9b9b'   // chữ phụ
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="custom.css" />
</head>

<body class="h-full bg-chat-main font-sans text-chat-text">

  <!-- ============ BỘ ICON (dùng lại bằng <use href="#i-...">) ============ -->
  <svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  </svg>

  <div id="app" class="flex h-full overflow-hidden">

    <!-- Công tắc sidebar trên mobile (không cần JS). Phải đứng ngay trước <aside>, lớp phủ và <main> -->
    <input type="checkbox" id="sidebar-toggle" class="peer sr-only" />

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar"
      class="safe-top fixed inset-y-0 left-0 z-30 flex w-[260px] -translate-x-full flex-col bg-chat-side
             transition-transform duration-200 ease-out peer-checked:translate-x-0 md:static md:translate-x-0">

      <div class="flex items-center gap-2 p-2">
        <button id="new-chat-btn" type="button"
          class="flex flex-1 items-center gap-2 rounded-lg px-3 py-2.5 text-sm hover:bg-chat-hover
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30">
          <svg class="icon h-5 w-5"><use href="#i-plus"/></svg>
          Cuộc trò chuyện mới
        </button>
        <!-- Nút đóng: chỉ hiện trên mobile -->
        <label for="sidebar-toggle" aria-label="Đóng thanh bên"
          class="cursor-pointer rounded-lg p-2.5 text-chat-mute hover:bg-chat-hover md:hidden">
          <svg class="icon h-5 w-5"><use href="#i-x"/></svg>
        </label>
      </div>

      <nav id="chat-history" class="scroll-area flex-1 overflow-y-auto px-2 pb-2" aria-label="Lịch sử trò chuyện">
        <h2 class="px-3 pb-1 pt-4 text-xs font-medium text-chat-mute">Gần đây</h2>
        <ul id="chat-list" class="space-y-0.5"></ul>
      </nav>

      <div class="border-t border-chat-line/60 p-2">
        <button type="button" id="user-menu-btn"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm hover:bg-chat-hover
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-sky-600 text-sm font-medium">N</span>
          <span class="flex-1 truncate">Người dùng</span>
          <svg class="icon h-4 w-4 text-chat-mute"><use href="#i-settings"/></svg>
        </button>
      </div>
    </aside>

    <!-- Lớp phủ mờ trên mobile: bấm để đóng sidebar -->
    <label for="sidebar-toggle" aria-label="Đóng thanh bên"
      class="fixed inset-0 z-20 hidden bg-black/60 peer-checked:block md:peer-checked:hidden"></label>

    <!-- ============ KHUNG CHAT CHÍNH ============ -->
    <main class="flex min-w-0 flex-1 flex-col">

      <header class="safe-top flex h-14 shrink-0 items-center gap-1 px-2 md:px-4">
        <label for="sidebar-toggle" aria-label="Mở thanh bên"
          class="cursor-pointer rounded-lg p-2.5 text-chat-mute hover:bg-chat-hover md:hidden">
          <svg class="icon h-5 w-5"><use href="#i-menu"/></svg>
        </label>
        <h1 id="chat-title" class="truncate px-2 text-base font-medium">Cuộc trò chuyện mới</h1>
      </header>

      <!-- Vùng tin nhắn: cuộn mượt -->
      <section id="messages" class="scroll-area relative flex-1 overflow-y-auto">
        <div id="empty-state" class="pointer-events-none absolute inset-0 flex items-center justify-center px-6">
          <h2 class="text-center text-2xl font-medium md:text-3xl">Bạn muốn trò chuyện về điều gì?</h2>
        </div>
        <div id="message-list" class="mx-auto w-full max-w-3xl space-y-8 px-4 py-6"></div>
      </section>

      <!-- Ô nhập tin nhắn -->
      <footer class="safe-bottom shrink-0 px-3 pt-2 md:px-4">
        <form id="chat-form" class="mx-auto w-full max-w-3xl">
          <div class="flex items-end gap-1 rounded-[28px] bg-chat-input p-2 focus-within:ring-1 focus-within:ring-white/20">
            <button type="button" aria-label="Đính kèm"
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-chat-mute hover:bg-white/10 hover:text-chat-text">
              <svg class="icon h-5 w-5"><use href="#i-plus"/></svg>
            </button>

            <label for="message-input" class="sr-only">Tin nhắn</label>
            <textarea id="message-input" rows="1" placeholder="Hỏi bất kỳ điều gì"
              class="composer-input scroll-area flex-1 resize-none bg-transparent px-2 py-2 leading-6 text-chat-text
                     placeholder-chat-mute focus:outline-none"></textarea>

            <button id="send-btn" type="submit" aria-label="Gửi tin nhắn" disabled
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-chat-text text-chat-main
                     transition-opacity hover:bg-white disabled:cursor-not-allowed disabled:bg-chat-text/20 disabled:text-chat-main/60">
              <svg class="icon h-5 w-5" style="stroke-width:2.25"><use href="#i-send"/></svg>
            </button>
          </div>
          <p class="mt-2 text-center text-xs text-chat-mute">Trợ lý có thể mắc lỗi. Hãy kiểm tra các thông tin quan trọng.</p>
        </form>
      </footer>
    </main>
  </div>

  <!-- Mẫu tin nhắn: JS nhân bản các mẫu này để tạo tin mới -->
  <template id="tpl-user">
    <div class="flex justify-end" data-role="user">
      <div data-text class="max-w-[85%] whitespace-pre-wrap break-words rounded-3xl bg-chat-input px-5 py-2.5 text-base leading-7 md:max-w-[75%]"></div>
    </div>
  </template>

  <template id="tpl-assistant">
    <div class="group flex gap-3 md:gap-4" data-role="assistant">
      <div class="mt-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-chat-line text-chat-text">
        <svg class="icon h-4 w-4"><use href="#i-sparkle"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <div data-text class="whitespace-pre-wrap break-words text-base leading-7"></div>
        <div data-sources class="mt-4 hidden space-y-2"></div>
        <div data-actions class="mt-2 hidden items-center gap-1 text-chat-mute md:opacity-0 md:transition-opacity md:group-hover:opacity-100 md:focus-within:opacity-100">
          <button type="button" data-action="copy" aria-label="Sao chép" class="rounded-md p-1.5 hover:bg-chat-hover hover:text-chat-text">
            <svg class="icon h-[18px] w-[18px]"><use href="#i-copy"/></svg>
          </button>
          <button type="button" data-action="regenerate" aria-label="Tạo lại câu trả lời" class="rounded-md p-1.5 hover:bg-chat-hover hover:text-chat-text">
            <svg class="icon h-[18px] w-[18px]"><use href="#i-refresh"/></svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <script src="main.js" defer></script>
</body>
</html>
